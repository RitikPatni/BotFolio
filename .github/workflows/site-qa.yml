name: Site QA

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/a11y-route-check.mjs"
      - "scripts/route-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-qa.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/a11y-route-check.mjs"
      - "scripts/route-contracts.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site-qa.yml"

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run site QA
        run: npm run qa:site
