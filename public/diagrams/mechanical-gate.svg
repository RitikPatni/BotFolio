<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Mechanical gates preserve taste</title><desc id="desc">A mechanical gate rejects invalid combinations before they ship.</desc>
<rect width="1200" height="420" rx="24" fill="#111827"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="60" fill="#9ca3af" font-family="ui-monospace,monospace" font-size="18" letter-spacing="3">THE FIX</text><text x="60" y="120" fill="#f9fafb" font-size="34" font-weight="600">Taste becomes durable when the system can enforce it.</text><g transform="translate(70 190)"><rect width="250" height="110" rx="16" fill="#263244"/><text x="125" y="45" text-anchor="middle" fill="#d1d5db" font-size="22">intent</text><text x="125" y="78" text-anchor="middle" fill="#9be15d" font-size="25" font-weight="600">type + variant</text><path d="M270 55h95" stroke="#75d6b0" stroke-width="4" marker-end="url(#arrow)"/><rect x="385" width="250" height="110" rx="16" fill="#18352b" stroke="#4d9672"/><text x="510" y="45" text-anchor="middle" fill="#9be15d" font-size="22">mechanical gate</text><text x="510" y="78" text-anchor="middle" fill="#f9fafb" font-size="25" font-weight="600">build rejects it</text><path d="M655 55h95" stroke="#75d6b0" stroke-width="4" marker-end="url(#arrow)"/><rect x="770" width="250" height="110" rx="16" fill="#263244"/><text x="895" y="45" text-anchor="middle" fill="#d1d5db" font-size="22">result</text><text x="895" y="78" text-anchor="middle" fill="#9be15d" font-size="25" font-weight="600">safe to ship</text></g><text x="70" y="355" fill="#9ca3af" font-size="20">The gate does not need better taste. It preserves yours.</text></g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#75d6b0"/></marker></defs></svg>