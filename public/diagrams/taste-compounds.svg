    <text x="108" y="39" fill="#f8fafc" font-size="25" font-weight="600">taste, left implicit</text>
    <text x="108" y="69" fill="#8d9bad" font-size="17">decisions the system has to guess</text>
    <path d="M46 106 C46 145 98 152 150 177" fill="none" stroke="#ff9c83" stroke-width="4" marker-end="url(#arrowRed)"/>
    <g transform="translate(126 164)" fill="none" stroke-linecap="round">
      <path d="M20 10 C120 110 70 15 238 98 S70 80 250 12" stroke="#ff9c83" stroke-width="5"/>
      <path d="M0 62 C100 -18 78 116 246 42 S105 104 258 80" stroke="#ffc28e" stroke-width="4"/>
      <path d="M40 112 C95 5 142 124 218 28 S150 70 270 112" stroke="#ff7272" stroke-width="4"/>
      <circle cx="64" cy="76" r="9" fill="#ff9c83" stroke="none"/>
      <circle cx="196" cy="50" r="9" fill="#ffc28e" stroke="none"/>
      <circle cx="232" cy="102" r="9" fill="#ff7272" stroke="none"/>
    </g>
    <text x="126" y="360" fill="#ffc28e" font-size="25" font-weight="600">plausible patches</text>
    <text x="126" y="390" fill="#ff9c83" font-size="17">complexity that looks complete</text>
  </g>

  <text x="64" y="640" fill="#65758a" font-family="ui-monospace,monospace" font-size="15">BRING TASTE. THE AGENT WILL COMPOUND IT.</text>
  <text x="1136" y="640" text-anchor="end" fill="#65758a" font-family="ui-monospace,monospace" font-size="15">KOBOYO ICONS / ART-DIRECTED</text>
</g>
</svg>
